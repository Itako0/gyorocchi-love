  <style>
    .footer { position: relative; }
    .footer-fran {
      position: absolute; right: 16px; bottom: 0;

      opacity: 0.8; pointer-events: none;

<body>



  <!-- NAV -->
    <nav class="navbar">
    <a class="nav-logo" href="index.html">
      <img src="assets/img/JAHlogo.png" alt="JAH" class="logo-icon logo-icon-img" />
      <span class="logo-text">梶原のウェブサイト</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="portfolio.html">PORTFOLIO</a></li>

    </ul>
    <button class="hamburger" id="hamburger" aria-label="menu">☰</button>
  </nav>

  <!-- BLOG HERO -->
  <section class="blog-hero">
    <img src="assets/img/niwatori.gif" alt="" class="blog-niwatori" />
    <div class="blog-hero-badge">✏️ 梶原のブログ</div>
    <h1>MY <span>BLOG</span></h1>
    <p>日々のことをゆるっと書きます。<br/>
    <p>好きな漫画家が絵日記書いてたから私もやりたい。<br/>
  </section>

  <!-- MAIN CONTENT -->
  <main class="blog-main">

    <!-- POSTS COLUMN -->
    <section>

      <!-- 記事一覧 -->
      <div class="posts-list" id="postsList"></div>

      <!-- 記事詳細 -->
      <div class="article-view" id="articleView">
        <button class="article-back" id="articleBack">← 一覧に戻る</button>
        <article>
          <header class="article-header" id="articleHeader"></header>
          <div class="article-body" id="articleBody"></div>
        </article>
      </div>

    </section>

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-block">
        <div class="profile-pic"><img src="assets/img/sioran.jpeg" alt="梶原のアイコン" /></div>
        <div class="profile-name">梶原</div>
        <p class="profile-bio">自由とお金と家族を愛しています<br/>♡BIG LOVE♡<br/>いろんなもの作るのが趣味です</p>
      </div>

      <div class="sidebar-block">
        <h3>🏷️ カテゴリ</h3>
        <div class="tag-cloud" id="tagCloud"></div>
      </div>

      <div class="sidebar-block">
        <h3>📅 アーカイブ</h3>
        <div class="archive-list" id="archiveList"></div>
      </div>

    </aside>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo"><img src="assets/img/JAHlogo.png" alt="JAH" class="footer-logo-img" /> 梶原のウェブサイト</div>

      </div>
    </div>
    <img src="assets/img/fran.gif" alt="" class="footer-fran" aria-hidden="true" />
  </footer>
