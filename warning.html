<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>418 I'm a teapot</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Shippori+Mincho:wght@400;600&family=Kaisei+Decol:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --ink: #1a1a1a; --muted: #55555c; --accent: #19dd3a; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 40px 20px;
      display: grid; place-items: center;
      background: #fff; color: var(--ink);
      font-family: 'Zen Maru Gothic', sans-serif;
    }
    main { width: min(560px, 100%); text-align: center; }
    .code { font-weight: 700; font-size: 0.85rem; letter-spacing: 0.1em; color: var(--muted); }
    h1 {
      margin: 16px 0 4px;
      font-family: 'Kaisei Decol', serif; font-weight: 700;
      font-size: clamp(4rem, 16vw, 7rem); line-height: 1.05;
    }
    h2 { margin: 0; font-family: 'Kaisei Decol', serif; font-size: clamp(1.3rem, 4vw, 1.8rem); }
    img { display: block; width: 100%; height: auto; margin: 28px 0; border-radius: 16px; }
    p { margin: 0 0 16px; font-family: 'Shippori Mincho', serif; color: var(--muted); font-size: 1.05rem; line-height: 1.9; }
    .quote { color: var(--ink); }
    a {
      display: inline-block; margin-top: 8px; padding: 12px 28px;
      border: 2px solid var(--ink); border-radius: 100px;
      color: var(--ink); text-decoration: none; font-weight: 700;
      transition: background 0.15s;
    }
    a:hover { background: var(--accent); }
    footer { margin-top: 40px; color: rgba(0,0,0,0.4); font-size: 0.75rem; letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <main>
    <div class="code">ERROR 418 / I'M A TEAPOT</div>
    <h1>418.</h1>
    <h2>I'm a teapot.</h2>

    <img src="assets/img/teapot.jpeg" alt="ティーポット">

    <p>
      このページはコーヒーを淹れるようには設計されていません。<br>
      そして、ソースコードを眺めても紅茶は出てきません。
    </p>
    <p class="quote">
      「つまり、勝手にコードを見ないでほしいってことです。」
    </p>

    <a href="index.html">← おとなしくトップページへ戻る</a>

    <footer>NO TEA WAS BREWED IN THE MAKING OF THIS ERROR.</footer>
  </main>

  <script src="warning.js"></script>
</body>
</html>
