<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="梶原の作品の詳細ページです。" />
  <meta property="og:title" content="作品 | 梶原のウェブサイト">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="https://itako0.github.io/gyorocchi-love/assets/img/favicon.png" type="image/png">

  <title>作品 | 梶原のウェブサイト</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="cursor.css" />
  <link rel="stylesheet" href="portfolio.css" />
</head>
<body>

  <!-- NAV -->
  <nav class="navbar">
    <a class="nav-logo" href="index.html">
      <span class="logo-icon">🦆</span>
      <span class="logo-text">梶原のウェブサイト</span>
    </a>
    <ul class="nav-links">
      <li><a href="portfolio.html" class="is-current">PORTFOLIO</a></li>
      <li><a href="index.html#about">ABOUTME</a></li>
      <li><a href="index.html#news">NEWS</a></li>
      <li><a href="blog.html" class="nav-cta">blog</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="menu">☰</button>
  </nav>

  <main class="page">
    <!-- work.html?id=作品ID で works.js の該当作品をJSが表示 -->
    <div class="article" id="workRoot"></div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo"><span>🦆</span> 梶原のウェブサイト</div>
      <p class="footer-text">© 2026 kajihara website nanisiyoukana.</p>
      <div class="footer-links">
        <a href="https://ja.wikipedia.org/wiki/%E3%83%8D%E3%82%B3">Neco</a>
        <a href="https://www.starbucks.co.jp/">cafeni</a>
        <a href="https://www.pref.hokkaido.lg.jp/">ikitai</a>
      </div>
    </div>
  </footer>

  <script src="works.js"></script>
  <script src="works-lib.js"></script>
  <script>
  (function () {
    const { esc, safeUrl, art, tags, renderBody } = WorksLib;
    const root = document.getElementById('workRoot');
    const id = new URLSearchParams(location.search).get('id');
    const works = typeof WORKS === 'undefined' ? [] : WORKS;
    const idx = works.findIndex(w => w.id === id);

    if (idx < 0) {
      document.title = '作品が見つかりません | 梶原のウェブサイト';
      root.innerHTML = `
        <a class="back-link" href="portfolio.html">← ポートフォリオ一覧へ</a>
        <p class="empty-note">この作品は見つかりませんでした。<br>URLが違うか、作品が削除された可能性があります。</p>`;
      return;
    }

    const w = works[idx];
    document.title = `${w.title} | 梶原のウェブサイト`;
    const setMeta = (sel, val) => { const el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
    setMeta('meta[name="description"]', w.summary || '');
    setMeta('meta[property="og:title"]', `${w.title} | 梶原のウェブサイト`);

    const links = (w.links || []).filter(l => l && l.url).map((l, i) =>
      `<a href="${esc(safeUrl(l.url))}" class="btn ${i === 0 ? 'btn-primary' : 'btn-game'}"` +
      `${/^https?:/i.test(l.url) ? ' target="_blank" rel="noopener"' : ''}>${esc(l.label || '開く')} →</a>`).join('');

    const prev = works[idx - 1], next = works[idx + 1];
    const pager = (prev || next) ? `
      <nav class="work-pager" aria-label="他の作品">
        ${prev ? `<a class="btn btn-ghost" href="work.html?id=${encodeURIComponent(prev.id)}">← ${esc(prev.title)}</a>` : '<span></span>'}
        ${next ? `<a class="btn btn-ghost" href="work.html?id=${encodeURIComponent(next.id)}">${esc(next.title)} →</a>` : ''}
      </nav>` : '';

    root.innerHTML = `
      <a class="back-link" href="portfolio.html">← ポートフォリオ一覧へ</a>
      <header class="work-head">
        ${tags(w)}
        <h1>${esc(w.title)}</h1>
        ${w.date ? `<p class="work-date">${esc(w.date)}</p>` : ''}
      </header>
      ${art(w, idx, 'article-cover')}
      <div class="article-card">
        <div class="article-body">${renderBody(w.body || w.summary)}</div>
        ${links ? `<div class="work-links">${links}</div>` : ''}
      </div>
      ${pager}`;
  })();
  </script>
</body>
</html>
