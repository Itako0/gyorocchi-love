<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="梶原が自主開発したゲームやアプリ、システムなどの作品一覧です。" />
  <meta property="og:title" content="ポートフォリオ | 梶原のウェブサイト">
  <meta property="og:description" content="梶原が自主開発したゲームやアプリ、システムなどの作品一覧です。">
  <meta property="og:image" content="https://itako0.github.io/gyorocchi-love/assets/img/thumbnail.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="https://itako0.github.io/gyorocchi-love/assets/img/favicon.png" type="image/png">

  <title>ポートフォリオ | 梶原のウェブサイト</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="cursor.css" />

  <style>
  /* =============================================
     portfolio.html 専用スタイル（変数・ナビ・ボタン・フッターは common.css）
     ・一覧   : portfolio.html
     ・詳細   : portfolio.html?id=作品ID
     ・登録   : portfolio.html?admin
     ============================================= */
  :root { --fade-both: linear-gradient(to bottom, transparent 0, #000 100px, #000 calc(100% - 160px), transparent 90%); }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--vsc-purple); outline-offset: 3px; }
  .nav-links a.is-current { opacity: 1; color: var(--teal); }

  /* ── ページ背景（index のポートフォリオ節と同じ光の丸） ── */
  .page { position: relative; isolation: isolate; overflow: hidden; min-height: 100vh; padding: 140px 5% 100px; background: var(--bg); }
  .page::before { content: ''; position: absolute; inset: -60px; z-index: -1; pointer-events: none;
    background:
      radial-gradient(circle 260px at 10% 38%, rgba(255,46,196,0.16) 0%, rgba(255,46,196,0.16) 45%, transparent 100%),
      radial-gradient(circle 240px at 93% 58%, rgba(25,221,58,0.16) 0%, rgba(25,221,58,0.16) 45%, transparent 100%),
      radial-gradient(circle 300px at 28% 90%, rgba(0,183,255,0.16) 0%, rgba(0,183,255,0.16) 45%, transparent 100%),
      radial-gradient(circle 200px at 52% 14%, rgba(255,215,38,0.14) 0%, rgba(255,215,38,0.14) 45%, transparent 100%),
      var(--glow-shapes);
    animation: floatA 14s ease-in-out infinite; -webkit-mask-image: var(--fade-both); mask-image: var(--fade-both); }
  .btn-ghost { background: transparent; color: var(--space-text); border-color: var(--space-text); box-shadow: 4px 4px 0 rgba(255,255,255,0.25); }
  .btn-ghost:hover { background: var(--space-text); color: var(--space-bg); }
  .empty-note { text-align: center; color: var(--page-text-sub); font-family: var(--font-mincho); line-height: 1.9; }
  .page-foot { max-width: 1100px; margin: 48px auto 0; text-align: right; position: relative; z-index: 1; }

  /* ── 作品一覧：すべて同じ大きさの正方形 ── */
  .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
  .work-card { aspect-ratio: 1 / 1; display: flex; flex-direction: column; background: rgba(255,255,255,0.8); border: 2.5px solid rgba(0,0,0,0.15); border-radius: var(--radius); overflow: hidden;
    opacity: 0; transform: translateY(24px); transition: opacity 0.5s, transform 0.5s, box-shadow 0.25s, border-color 0.25s; }
  .work-card.revealed { opacity: 1; transform: none; }
  .work-card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,0.15); border-color: var(--orange); }

  .work-art { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .work-card .work-art { flex: 0 0 50%; }
  .work-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .work-emoji { font-size: 56px; position: relative; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.2)); }
  .art-0 { background: linear-gradient(135deg, #f4d5b8, #e8a87c, #d4956a); }
  .art-1 { background: linear-gradient(135deg, #b2e0e0, #7ec8c8, #4ba3a3); }
  .art-2 { background: linear-gradient(135deg, #e8d5c0, #c4956a, #8b5e3c); }
  .art-3 { background: linear-gradient(135deg, #d8b8f4, #a87ce8, #6a4fd4); }

  .work-info { flex: 1; min-height: 0; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .work-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .work-card .work-tags { flex-wrap: nowrap; overflow: hidden; }
  .work-card .tag { font-size: 0.68rem; padding: 2px 9px; white-space: nowrap; }
  .work-title { font-family: var(--font-display); font-size: 1.1rem; line-height: 1.3; color: var(--brown); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .work-info .btn { margin-top: auto; align-self: flex-start; font-size: 0.75rem; padding: 7px 16px; }

  /* ── 詳細（ブログ形式） ── */
  .article { max-width: 820px; margin: 0 auto; position: relative; }
  .back-link { display: inline-block; margin-bottom: 28px; font-weight: 700; letter-spacing: 0.05em; color: var(--page-text-sub); transition: color 0.2s; }
  .back-link:hover { color: var(--teal); }
  .work-head { margin-bottom: 28px; }
  .work-head .work-tags { margin-bottom: 16px; }
  .work-head .tag:not(.tag-new):not(.tag-classic):not(.tag-hard) { color: var(--page-text-sub); border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); }
  .work-head h1 { font-family: var(--font-display); font-size: clamp(2rem, 5.5vw, 3.4rem); line-height: 1.15; color: var(--page-text); }
  .work-date { margin-top: 10px; color: var(--page-text-sub); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.1em; }
  .article-cover { border-radius: var(--radius-lg); border: 2.5px solid rgba(0,0,0,0.15); aspect-ratio: 16 / 9; margin-bottom: 24px; }
  .article-cover .work-emoji { font-size: 120px; }
  .article-card { background: rgba(255,255,255,0.88); border: 2.5px solid rgba(0,0,0,0.15); border-radius: var(--radius-lg); padding: clamp(24px, 5vw, 56px); }
  .article-body { font-family: var(--font-mincho); font-size: 1.05rem; line-height: 2; color: var(--brown); }
  .article-body > * + * { margin-top: 1.2em; }
  .article-body > :first-child { margin-top: 0; }
  .article-body h2 { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.3; margin-top: 2em; padding-left: 14px; border-left: 6px solid var(--teal); }
  .article-body h3 { font-family: var(--font-display); font-size: 1.3rem; line-height: 1.4; margin-top: 1.8em; }
  .article-body ul { padding-left: 1.4em; list-style: disc; }
  .article-body a { color: #0077b3; text-decoration: underline; text-underline-offset: 3px; }
  .article-body img { max-width: 100%; border-radius: var(--radius); }
  .article-body figure { text-align: center; }
  .article-body figcaption { font-size: 0.85rem; color: var(--brown-mid); margin-top: 6px; }
  /* 作品販売サイトなどへのボタン（links に書いたものが並ぶ） */
  .work-links { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 40px; padding-top: 32px; border-top: 2px dashed rgba(0,0,0,0.15); }
  .work-pager { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 40px; }

  /* ── 登録ツール ── */
  .admin-wrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
  .admin-card { background: rgba(255,255,255,0.9); border: 2.5px solid rgba(0,0,0,0.15); border-radius: var(--radius-lg); padding: 24px; color: var(--brown); }
  .admin-card h2 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 14px; }
  .hint, .field small { color: var(--brown-mid); font-size: 0.8rem; line-height: 1.6; }
  .admin-full { grid-column: 1 / -1; }
  .work-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .work-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 2px solid rgba(0,0,0,0.12); border-radius: 14px; background: #fff; }
  .work-list li.is-editing { border-color: var(--teal); background: #eefaff; }
  .li-title { font-weight: 700; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-btns { display: flex; gap: 4px; flex-shrink: 0; }
  .mini-btn { font: inherit; font-size: 0.8rem; font-weight: 700; padding: 4px 9px; border: 2px solid var(--brown); border-radius: 100px; background: #fff; color: var(--brown); cursor: pointer; }
  .mini-btn:hover { background: var(--brown); color: #fff; }
  .mini-btn.danger:hover { background: #d4145a; border-color: #d4145a; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
  .field > label { font-weight: 700; font-size: 0.9rem; }
  .field input[type="text"], .field textarea, .out-area { font: inherit; font-size: 0.95rem; padding: 10px 14px; border: 2px solid rgba(0,0,0,0.25); border-radius: 14px; background: #fff; color: var(--brown); width: 100%; }
  .field textarea { line-height: 1.7; resize: vertical; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .file-row { display: flex; gap: 10px; align-items: center; }
  .file-row input[type="file"] { font-size: 0.8rem; max-width: 45%; }
  .field.check { flex-direction: row; align-items: center; gap: 10px; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .btn-row .btn { font-size: 0.9rem; padding: 10px 22px; cursor: pointer; }
  .admin-card .btn-outline { color: var(--brown); border-color: var(--brown); }
  .admin-card .btn-outline:hover { color: #fff; }
  .msg { margin-top: 12px; min-height: 1.4em; font-weight: 700; font-size: 0.9rem; }
  .msg.err { color: #d4145a; }
  .msg.ok { color: #0a8a28; }
  .out-area { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; height: 240px; margin-bottom: 14px; white-space: pre; }
  .preview-box { margin-top: 14px; padding: 18px; border: 2px dashed rgba(0,0,0,0.2); border-radius: 14px; }
  .steps { margin: 0 0 14px 1.3em; list-style: decimal; line-height: 1.8; font-size: 0.9rem; }

  @media (max-width: 900px) { .admin-wrap { grid-template-columns: 1fr; } }
  @media (max-width: 600px) {
    .page { padding-top: 120px; }
    .works-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .work-info { padding: 10px 12px 12px; }
    .work-title { font-size: 0.95rem; }
    .work-card .work-emoji { font-size: 44px; }
    .field-row { grid-template-columns: 1fr; }
    .file-row { flex-wrap: wrap; }
    .file-row input[type="file"] { max-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .page::before { animation: none; }
    .work-card { opacity: 1; transform: none; transition: none; }
    .work-card:hover { transform: none; }
  }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="navbar">
    <a class="nav-logo" href="index.html">
      <span class="logo-icon">🦆</span>
      <span class="logo-text">梶原のウェブサイト</span>
    </a>
    <ul class="nav-links">
      <li><a href="portfolio.html" class="is-current">PORTFOLIO</a></li>
      <li><a href="index.html#about">ABOUTME</a></li>
      <li><a href="index.html#news">NEWS</a></li>
      <li><a href="blog.html" class="nav-cta">blog</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="menu">☰</button>
  </nav>

  <!-- 一覧・詳細・登録のどれかがここに入る -->
  <main class="page" id="view"></main>

  <!-- 登録ツールの画面（?admin のときだけ使う） -->
  <template id="adminTpl">
    <div class="section-header">
      <h1 class="section-title">作品登録</h1>
      <p class="section-sub">フォームに入力 → works.js を書き出して置き換えるだけ</p>
    </div>
    <div class="admin-wrap">
      <section class="admin-card">
        <h2>登録済みの作品</h2>
        <ul class="work-list" id="list"></ul>
        <p class="hint">↑↓で並び順を変更できます。上にあるものほど一覧の先頭に表示されます。</p>
        <div class="btn-row"><button type="button" class="btn btn-primary" id="newBtn">＋ 新しい作品</button></div>
      </section>

      <section class="admin-card">
        <h2 id="formTitle">新しい作品を追加</h2>
        <div class="field-row">
          <div class="field"><label for="f-title">作品名</label><input type="text" id="f-title" placeholder="例：スタディーモンスター"></div>
          <div class="field"><label for="f-id">ID（半角英数字とハイフン）</label><input type="text" id="f-id" placeholder="例：study-monster">
            <small>詳細ページのURL（portfolio.html?id=○○）に使われます。あとから変えるとリンクが切れます。</small></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f-type">種類</label><input type="text" id="f-type" list="types" placeholder="App / Web / Game など">
            <datalist id="types"><option value="App"><option value="Web"><option value="Game"></datalist></div>
          <div class="field"><label for="f-tags">タグ（カンマ区切り）</label><input type="text" id="f-tags" placeholder="例：Raising Sim, support"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f-date">公開日・時期（任意）</label><input type="text" id="f-date" placeholder="例：2026-11"></div>
          <div class="field"><label for="f-emoji">絵文字（画像がない時に表示）</label><input type="text" id="f-emoji" placeholder="例：🦖"></div>
        </div>
        <div class="field">
          <label for="f-image">カバー画像（任意）</label>
          <div class="file-row">
            <input type="text" id="f-image" placeholder="assets/img/xxx.png">
            <input type="file" id="f-file" accept="image/*" aria-label="画像ファイルを選ぶ">
          </div>
          <small>画像ファイル自体は assets/img/ フォルダに置いてください。ファイルを選ぶとパスだけ自動で入ります。</small>
        </div>
        <div class="field"><label for="f-summary">短い説明（詳細ページの冒頭・検索結果用）</label><textarea id="f-summary" rows="2" placeholder="1〜2文で。"></textarea></div>
        <div class="field">
          <label for="f-body">詳細ページの本文</label>
          <textarea id="f-body" rows="12" placeholder="## 概要&#10;ここに説明を書きます。"></textarea>
          <small>## 見出し ／ ### 小見出し ／ 空行で段落 ／ - 箇条書き<br>![説明](assets/img/xxx.png) で画像 ／ [文字](URL) でリンク ／ **太字**</small>
        </div>
        <div class="field">
          <label for="f-links">ボタンのリンク（販売サイトなど・1行に1つ）</label>
          <textarea id="f-links" rows="3" placeholder="販売サイトで見る | https://example.com/"></textarea>
          <small>「ボタン名 | URL」の形で書きます。1行目が目立つボタンになります。空欄ならボタンは出ません。</small>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="saveBtn">追加する</button>
          <button type="button" class="btn btn-outline" id="resetBtn">入力をクリア</button>
        </div>
        <p class="msg" id="msg" role="status"></p>
        <div class="preview-box"><small>本文のプレビュー</small><div class="article-body" id="preview"></div></div>
      </section>

      <section class="admin-card admin-full">
        <h2>works.js を書き出す</h2>
        <ol class="steps">
          <li>上で作品を追加・編集・並べ替えする</li>
          <li>「ダウンロード」で works.js を保存し、サイト内の works.js と置き換える</li>
          <li>画像を使った場合は assets/img/ にも置いて、まとめてアップロード</li>
        </ol>
        <textarea class="out-area" id="out" readonly aria-label="生成された works.js"></textarea>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="dlBtn">works.js をダウンロード</button>
          <button type="button" class="btn btn-outline" id="copyBtn">コピー</button>
        </div>
        <p class="hint" style="margin-top:12px">このページはファイルを書き出すだけで、サイトを直接書き換えることはありません。ブラウザを閉じると編集中の内容は消えるので、区切りごとにダウンロードしてください。</p>
      </section>
    </div>

  <!-- DATA（作品データ） -->
  <script src="works.js"></script>

  <script>
  (function () {
    const $ = id => document.getElementById(id);
    const view = $('view');
    const params = new URLSearchParams(location.search);
    const works = typeof WORKS === 'undefined' ? [] : WORKS;

    document.getElementById('hamburger').addEventListener('click', () => document.querySelector('.nav-links').classList.toggle('open'));

    /* ───────── 共通の部品 ───────── */
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safeUrl = u => /^\s*(javascript|data|vbscript):/i.test(u) ? '#' : u;
    const tagClass = t => ({ App: 'tag-new', Web: 'tag-classic' }[t] || 'tag-hard');
    const artClass = i => 'art-' + (i % 4);
    const detailUrl = id => 'portfolio.html?id=' + encodeURIComponent(id);

    function art(w, i, extra) {
      return `<div class="work-art ${artClass(i)} ${extra || ''}">` +
        `<span class="work-emoji" aria-hidden="true">${esc(w.emoji || '🦆')}</span>` +
        (w.image ? `<img src="${esc(w.image)}" alt="${esc(w.title)}" onerror="this.remove()">` : '') + '</div>';
    }
    function tags(w, limit) {
      const all = [`<span class="tag ${tagClass(w.type)}">${esc(w.type || 'Work')}</span>`]
        .concat((w.tags || []).map(t => `<span class="tag">${esc(t)}</span>`));
      return `<div class="work-tags">${(limit ? all.slice(0, limit) : all).join('')}</div>`;
    }

    // 本文の軽いマークアップ → HTML
    function inline(t) {
      return esc(t)
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) =>
          `<a href="${safeUrl(url)}"${/^https?:/i.test(url) ? ' target="_blank" rel="noopener"' : ''}>${label}</a>`)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }
    function renderBody(text) {
      const lines = String(text || '').replace(/\r/g, '').split('\n');
      let html = '', para = [], list = [];
      const flushP = () => { if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
      const flushL = () => { if (list.length) { html += '<ul>' + list.map(i => '<li>' + inline(i) + '</li>').join('') + '</ul>'; list = []; } };
      for (const raw of lines) {
        const l = raw.trim(); let m;
        if (!l) { flushP(); flushL(); continue; }
        if ((m = l.match(/^(#{2,3})\s+(.+)$/))) { flushP(); flushL(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
        else if ((m = l.match(/^!\[(.*?)\]\((\S+?)\)$/))) { flushP(); flushL(); html += `<figure><img src="${esc(safeUrl(m[2]))}" alt="${esc(m[1])}" loading="lazy">${m[1] ? `<figcaption>${esc(m[1])}</figcaption>` : ''}</figure>`; }
        else if ((m = l.match(/^[-・]\s+(.+)$/))) { flushP(); list.push(m[1]); }
        else { flushL(); para.push(l); }
      }
      flushP(); flushL();
      return html;
    }

    /* ───────── 一覧 ───────── */
    function showList() {
      if (!works.length) {
        view.innerHTML = headerHtml() + '<p class="empty-note">まだ作品が登録されていません。<br>portfolio.html?admin から作品を追加できます。</p>';
        return;
      }
      view.innerHTML = headerHtml() + '<div class="works-grid" id="worksGrid">' + works.map((w, i) => `
        <article class="work-card">
          ${art(w, i)}
          <div class="work-info">
            ${tags(w, 2)}
            <h2 class="work-title">${esc(w.title)}</h2>
            <a href="${detailUrl(w.id)}" class="btn btn-game">READ MORE →</a>
          </div>
        </article>`).join('') + '</div><div class="page-foot"><a href="index.html" class="btn btn-ghost">← TOPへ戻る</a></div>';

      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('revealed'); io.unobserve(e.target); } }), { threshold: 0.15 });
      view.querySelectorAll('.work-card').forEach(el => io.observe(el));
    }
    function headerHtml() {
      return '<div class="section-header"><h1 class="section-title">ポートフォリオ</h1><p class="section-sub">自主開発した主要なゲームやアプリ、システムなど</p></div>';
    }

    /* ───────── 詳細（ブログ形式） ───────── */
    function showDetail(id) {
      const idx = works.findIndex(w => w.id === id);
      if (idx < 0) {
        document.title = '作品が見つかりません | 梶原のウェブサイト';
        view.innerHTML = '<div class="article"><a class="back-link" href="portfolio.html">← ポートフォリオ一覧へ</a><p class="empty-note">この作品は見つかりませんでした。<br>URLが違うか、作品が削除された可能性があります。</p></div>';
        return;
      }
      const w = works[idx];
      document.title = `${w.title} | 梶原のウェブサイト`;
      const setMeta = (sel, v) => { const el = document.querySelector(sel); if (el) el.setAttribute('content', v); };
      setMeta('meta[name="description"]', w.summary || '');
      setMeta('meta[property="og:title"]', document.title);
      setMeta('meta[property="og:description"]', w.summary || '');

      const links = (w.links || []).filter(l => l && l.url).map((l, i) =>
        `<a href="${esc(safeUrl(l.url))}" class="btn ${i === 0 ? 'btn-primary' : 'btn-game'}"${/^https?:/i.test(l.url) ? ' target="_blank" rel="noopener"' : ''}>${esc(l.label || '開く')} →</a>`).join('');
      const prev = works[idx - 1], next = works[idx + 1];
      const pager = (prev || next) ? `<nav class="work-pager" aria-label="他の作品">
          ${prev ? `<a class="btn btn-ghost" href="${detailUrl(prev.id)}">← ${esc(prev.title)}</a>` : '<span></span>'}
          ${next ? `<a class="btn btn-ghost" href="${detailUrl(next.id)}">${esc(next.title)} →</a>` : ''}</nav>` : '';

      view.innerHTML = `<div class="article">
        <a class="back-link" href="portfolio.html">← ポートフォリオ一覧へ</a>
        <header class="work-head">${tags(w)}<h1>${esc(w.title)}</h1>${w.date ? `<p class="work-date">${esc(w.date)}</p>` : ''}</header>
        ${art(w, idx, 'article-cover')}
        <div class="article-card">
          <div class="article-body">${renderBody(w.body || w.summary)}</div>
          ${links ? `<div class="work-links">${links}</div>` : ''}
        </div>
        ${pager}</div>`;
    }

    /* ───────── 登録ツール（?admin） ───────── */
    function showAdmin() {
      document.title = '作品登録 | 梶原のウェブサイト';
      document.head.insertAdjacentHTML('beforeend', '<meta name="robots" content="noindex, nofollow">');
      view.appendChild($('adminTpl').content.cloneNode(true));

      let list = JSON.parse(JSON.stringify(works));
      let editing = -1;

      const HEADER = `/* ============================================
   works.js — 作品データ
   ・配列の上にあるものほど先に表示されます
   ・追加／編集は portfolio.html?admin で行い、書き出した works.js で
     このファイルを置き換えるのが簡単です（手で書き足してもOK）
   ・body の書き方: ## 見出し / ### 小見出し / - 箇条書き
     ![説明](assets/img/xxx.png) / [文字](URL) / **太字** / 空行で段落
   ============================================ */
`;
      const q  = s => "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n') + "'";
      const bt = s => '`' + String(s).replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${') + '`';
      function serialize(arr) {
        const items = arr.map(w => {
          const L = [];
          L.push(`    id: ${q(w.id)},`, `    title: ${q(w.title)},`, `    type: ${q(w.type)},`);
          if (w.tags && w.tags.length) L.push(`    tags: [${w.tags.map(q).join(', ')}],`);
          if (w.date) L.push(`    date: ${q(w.date)},`);
          if (w.emoji) L.push(`    emoji: ${q(w.emoji)},`);
          if (w.image) L.push(`    image: ${q(w.image)},`);
          L.push(`    summary: ${q(w.summary)},`);
          L.push(`    body: ${bt(w.body)}` + (w.links && w.links.length ? ',' : ''));
          if (w.links && w.links.length) L.push('    links: [\n' + w.links.map(k => `      { label: ${q(k.label)}, url: ${q(k.url)} }`).join(',\n') + '\n    ]');
          return '  {\n' + L.join('\n') + '\n  }';
        });
        return HEADER + 'const WORKS = [\n' + items.join(',\n') + '\n];\n';
      }

      function refresh() {
        $('list').innerHTML = list.length ? list.map((w, i) => `
          <li class="${i === editing ? 'is-editing' : ''}">
            <span class="li-title">${esc(w.emoji || '')} ${esc(w.title)}</span>
            <span class="li-btns">
              <button type="button" class="mini-btn" data-a="up" data-i="${i}" aria-label="上へ">↑</button>
              <button type="button" class="mini-btn" data-a="down" data-i="${i}" aria-label="下へ">↓</button>
              <button type="button" class="mini-btn" data-a="edit" data-i="${i}">編集</button>
              <button type="button" class="mini-btn danger" data-a="del" data-i="${i}">削除</button>
            </span></li>`).join('') : '<li><span class="li-title">まだ作品がありません</span></li>';
        $('out').value = serialize(list);
        $('formTitle').textContent = editing >= 0 ? '作品を編集' : '新しい作品を追加';
        $('saveBtn').textContent = editing >= 0 ? '更新する' : '追加する';
      }
      const say = (t, ok) => { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); };
      const preview = () => { $('preview').innerHTML = renderBody($('f-body').value); };

      function fill(w) {
        $('f-title').value = w.title || ''; $('f-id').value = w.id || ''; $('f-type').value = w.type || '';
        $('f-tags').value = (w.tags || []).join(', '); $('f-date').value = w.date || '';
        $('f-emoji').value = w.emoji || ''; $('f-image').value = w.image || '';
        $('f-summary').value = w.summary || ''; $('f-body').value = w.body || '';
        $('f-links').value = (w.links || []).map(l => `${l.label} | ${l.url}`).join('\n');
        preview();
      }
      function read() {
        const links = $('f-links').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
          const p = l.indexOf('|');
          return p < 0 ? { label: '', url: l } : { label: l.slice(0, p).trim(), url: l.slice(p + 1).trim() };
        });
        return {
          id: $('f-id').value.trim(), title: $('f-title').value.trim(), type: $('f-type').value.trim() || 'Web',
          tags: $('f-tags').value.split(/[,、]/).map(t => t.trim()).filter(Boolean),
          date: $('f-date').value.trim(), emoji: $('f-emoji').value.trim(), image: $('f-image').value.trim(),
          summary: $('f-summary').value.trim(), body: $('f-body').value.replace(/\r/g, '').trim(), links
        };
      }
      const startNew = () => { editing = -1; fill({}); say('', true); refresh(); };

      $('list').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        const i = +b.dataset.i, a = b.dataset.a;
        if (a === 'edit') { editing = i; fill(list[i]); say('', true); }
        if (a === 'up' && i > 0) { [list[i - 1], list[i]] = [list[i], list[i - 1]]; if (editing === i) editing--; else if (editing === i - 1) editing++; }
        if (a === 'down' && i < list.length - 1) { [list[i + 1], list[i]] = [list[i], list[i + 1]]; if (editing === i) editing++; else if (editing === i + 1) editing--; }
        if (a === 'del' && confirm(`「${list[i].title}」を削除しますか？`)) {
          list.splice(i, 1);
          if (editing === i) { editing = -1; fill({}); } else if (editing > i) editing--;
        }
        refresh();
      });
      $('saveBtn').addEventListener('click', () => {
        const w = read();
        if (!w.title) return say('作品名を入力してください。', false);
        if (!/^[a-z0-9][a-z0-9-]*$/.test(w.id)) return say('IDは半角の小文字英数字とハイフンで入力してください（例：study-monster）。', false);
        if (list.some((x, i) => x.id === w.id && i !== editing)) return say('そのIDはすでに使われています。別のIDにしてください。', false);
        if (!w.summary) return say('短い説明を入力してください。', false);
        if (w.links.some(l => !l.label || !l.url)) return say('ボタンのリンクは「ボタン名 | URL」の形で書いてください。', false);
        if (editing >= 0) { list[editing] = w; say('更新しました。下の works.js に反映されています。', true); }
        else { list.push(w); editing = list.length - 1; say('追加しました（一覧の最後）。下の works.js に反映されています。', true); }
        refresh();
      });
      $('newBtn').addEventListener('click', startNew);
      $('resetBtn').addEventListener('click', startNew);
      $('f-body').addEventListener('input', preview);
      $('f-file').addEventListener('change', e => { const f = e.target.files[0]; if (f) $('f-image').value = 'assets/img/' + f.name; });
      $('dlBtn').addEventListener('click', () => {
        const url = URL.createObjectURL(new Blob([$('out').value], { type: 'text/javascript' }));
        const a = Object.assign(document.createElement('a'), { href: url, download: 'works.js' });
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      });
      $('copyBtn').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText($('out').value); } catch (_) { $('out').select(); document.execCommand('copy'); }
        const b = $('copyBtn'), t = b.textContent; b.textContent = 'コピーしました'; setTimeout(() => b.textContent = t, 1500);
      });
      refresh();
    }

    /* ───────── どの画面を出すか ───────── */
    if (params.has('admin')) showAdmin();
    else if (params.has('id')) showDetail(params.get('id'));
    else showList();
  })();
  </script>
</body>
</html>
