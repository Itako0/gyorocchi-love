  <style>
    .footer { position: relative; }
    .footer-fran {
      position: absolute; right: 16px; bottom: 0;
      width: 160px; height: 160px;
      opacity: 0.9; pointer-events: none;
      image-rendering: pixelated;
    }
    /* ── 背景の魚（半透明・ゆらゆら） ── */
    .fish-bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .fish {
      position: absolute; width: clamp(200px, 15vw, 210px); height: auto;
      opacity: 0.7;
      animation: fish-sway 6s ease-in-out infinite;
    }
    /* 左列 */
    .fish-catfish  { left: 2%;  top: 6%;  width: clamp(300px, 24vw, 340px); animation-duration: 7s; }
    .fish-bwfish   { left: 3%;  top: 40%; animation-duration: 6s;   animation-delay: -2s; }
    .fish-batafish { left: 2%;  top: 70%; animation-duration: 8s;   animation-delay: -4s; }
    /* 右列（左より少し下） */
    .fish-goldfish { right: 2%; top: 17%; animation-duration: 6.5s; animation-delay: -1s; }
    .fish-nautilus { right: 3%; top: 52%; animation-duration: 7.5s; animation-delay: -3s; }
    .fish-bluefish { right: 2%; top: 82%; animation-duration: 5.5s; animation-delay: -5s; }
    @keyframes fish-sway {
      0%, 100% { transform: translateX(-10px) rotate(-3deg); }
      50%      { transform: translateX(10px)  rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) { .fish { animation: none; } }
    /* ── 海・水中エフェクト（一番奥のレイヤー：光の丸・魚・カードより後ろ） ── */
    .sea-bg { position: absolute; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; }
    /* 水の色：上は明るく、下ほど深く */
    .sea-water {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom,
        rgba(130, 210, 235, 0.16) 0%,
        rgba(50, 140, 190, 0.12) 50%,
        rgba(10, 60, 120, 0.20) 100%);
    }
    /* 水面から差し込む光の筋（上部だけ） */
    .sea-rays {
      position: absolute; top: 0; left: -15%; width: 130%; height: 900px;
      background: repeating-linear-gradient(105deg,
        transparent 0 70px, rgba(190, 235, 255, 0.10) 100px, transparent 150px);
      -webkit-mask-image: linear-gradient(to bottom, #000, transparent);
              mask-image: linear-gradient(to bottom, #000, transparent);
      animation: sea-rays 14s ease-in-out infinite alternate;
    }
    .sea-rays.r2 {
      background: repeating-linear-gradient(98deg,
        transparent 0 110px, rgba(190, 235, 255, 0.07) 140px, transparent 200px);
      animation-duration: 19s; animation-direction: alternate-reverse;
    }
    @keyframes sea-rays {
      from { transform: translateX(-40px); }
      to   { transform: translateX(40px); }
    }
    /* 泡 */
    .bubble {
      position: absolute; bottom: -60px; left: var(--l);
      width: var(--s); height: var(--s); border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0.05) 60%);
      opacity: 0.35;
      animation: bubble-rise var(--t) linear infinite, bubble-wobble 4s ease-in-out infinite alternate;
      animation-delay: var(--d), var(--d);
    }
    @keyframes bubble-rise   { from { bottom: -60px; } to { bottom: 105%; } }
    @keyframes bubble-wobble { from { transform: translateX(-12px); } to { transform: translateX(12px); } }
    @media (prefers-reduced-motion: reduce) { .sea-rays, .bubble { animation: none; } }
  </style>
